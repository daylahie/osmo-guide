<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Osmo Guide</title>
  <meta name="description" content="Bảng tra nhanh DJI Osmo Pocket 4 và DJI Mic Mini 2" />

  <!-- PWA / iOS -->
  <meta name="theme-color" content="#FAF1F1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Osmo Guide" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />

  <!-- Font bo tròn dự phòng cho máy không có SF Pro Rounded -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Text"', '"Segoe UI"', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
            round: ['ui-rounded', '"SF Pro Rounded"', 'Nunito', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
          },
          colors: {
            ink: '#2E2430',
            soft: '#7C6F80',
            rose: { DEFAULT: '#C2577A', 50: '#FCF1F4', 100: '#F8E1E8' },
            lilac: { DEFAULT: '#8B72C9', 50: '#F4F0FC' },
            sage: { DEFAULT: '#4E9A7A', 50: '#EAF5EF' },
          },
        },
      },
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>

  <style>
    :root {
      --bg: #FAF1F1;
      --glass: rgba(255, 255, 255, .6);
      --glass-border: rgba(255, 255, 255, .85);
      --hairline: rgba(46, 36, 48, .08);
      --shadow: 0 1px 1px rgba(90, 50, 70, .04), 0 10px 30px -8px rgba(120, 70, 95, .14);
    }
    html, body { background: var(--bg); color: #2E2430; -webkit-tap-highlight-color: transparent; }
    body { -webkit-font-smoothing: antialiased; overscroll-behavior-y: none; min-height: 100vh; }
    [x-cloak] { display: none !important; }

    /* Nền màu mềm phía sau lớp kính */
    .backdrop { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;
      background: linear-gradient(180deg, #FBF4F3 0%, #F7EEF4 55%, #F3EEF8 100%); }
    .blob { position: absolute; border-radius: 999px; filter: blur(60px); opacity: .75; }
    .blob.a { width: 340px; height: 340px; background: #F7CFDB; top: -90px; left: -80px; }
    .blob.b { width: 300px; height: 300px; background: #DED3F6; top: 30%; right: -110px; }
    .blob.c { width: 280px; height: 280px; background: #FBE0CF; bottom: -80px; left: 10%; }

    .glass {
      background: var(--glass);
      -webkit-backdrop-filter: blur(28px) saturate(170%);
      backdrop-filter: blur(28px) saturate(170%);
      border: 1px solid var(--glass-border);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.9), var(--shadow);
    }
    .card { border-radius: 22px; }
    .hair > * + * { border-top: 1px solid var(--hairline); }
    .h2 { font-family: ui-rounded, "SF Pro Rounded", Nunito, -apple-system, sans-serif; font-size: 17px; font-weight: 700; }

    .tile { width: 26px; height: 26px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #fff; flex-shrink: 0;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 2px 6px -2px rgba(0,0,0,.18); }
    .g-rose  { background: linear-gradient(160deg, #E58AA6, #C2577A); }
    .g-lilac { background: linear-gradient(160deg, #B39DE8, #8B72C9); }
    .g-peach { background: linear-gradient(160deg, #F2B27F, #D98A4E); }
    .g-sky   { background: linear-gradient(160deg, #94B6EA, #5B84C4); }
    .g-sage  { background: linear-gradient(160deg, #84C5A6, #4E9A7A); }

    /* Hàng tra cứu: thao tác → kết quả */
    .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; font-size: 15px; }
    .row .k { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 13px; font-weight: 600;
      background: rgba(255,255,255,.8); border: 1px solid var(--hairline); white-space: nowrap; }
    .row .v { text-align: right; font-weight: 500; }
    .tag { display: inline-flex; align-items: center; padding: 4px 10px; border-radius: 999px; font-size: 13px; font-weight: 700;
      background: #FCF1F4; color: #B04A6C; white-space: nowrap; }
    .dot { width: 10px; height: 10px; border-radius: 999px; flex-shrink: 0; display: inline-block; }

    .fade-in { animation: fade .25s ease-out; }
    @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    .press { transition: transform .15s ease; }
    .press:active { transform: scale(.97); }

    /* Thanh tab nổi */
    .dock { position: fixed; z-index: 30; left: 50%; transform: translateX(-50%);
      bottom: calc(env(safe-area-inset-bottom) + 12px); width: min(360px, calc(100% - 28px)); border-radius: 999px; padding: 5px; }
    .dock .indicator { position: absolute; top: 0; bottom: 0; left: 0; width: calc(100% / 3); border-radius: 999px;
      background: rgba(255,255,255,.92); box-shadow: 0 2px 10px -2px rgba(194,87,122,.28), inset 0 0 0 1px rgba(194,87,122,.08);
      transition: transform .35s cubic-bezier(.3,1.25,.4,1); }

    .pt-safe { padding-top: max(env(safe-area-inset-top), 16px); }
    .pb-dock { padding-bottom: calc(env(safe-area-inset-bottom) + 104px); }

    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>

<body class="font-sans" x-data="app()" x-init="init()">
  <div class="backdrop" aria-hidden="true"><div class="blob a"></div><div class="blob b"></div><div class="blob c"></div></div>

  <div class="relative z-10 mx-auto w-full max-w-3xl">
    <header class="pt-safe md:pt-10 px-5 pb-3">
      <p class="text-[13px] font-semibold text-rose pt-2">Osmo Pocket 4 · Mic Mini 2</p>
      <h1 class="font-round text-[30px] md:text-[34px] leading-tight font-extrabold tracking-tight mt-1" x-text="tabs[tab].title"></h1>
    </header>

    <main class="px-4 pb-dock">

      <!-- ================= TAB 1: ĐIỀU KHIỂN ================= -->
      <section x-show="tab === 0" x-cloak class="fade-in grid gap-3 md:grid-cols-2 md:items-start">

        <article class="glass card px-4 py-3">
          <h2 class="h2 flex items-center gap-2 pt-1 pb-1"><span class="tile g-rose" x-html="ic.cam"></span>Nút bấm</h2>
          <div class="hair">
            <template x-for="r in camButtons" :key="r[0]">
              <div class="row"><span class="k" x-html="r[0]"></span><span class="v" x-text="r[1]"></span></div>
            </template>
          </div>
        </article>

        <article class="glass card px-4 py-3">
          <h2 class="h2 flex items-center gap-2 pt-1 pb-1"><span class="tile g-lilac" x-html="ic.hand"></span>Màn hình &amp; cử chỉ</h2>
          <div class="hair">
            <template x-for="r in gestures" :key="r[0]">
              <div class="row"><span class="k" x-html="r[0]"></span><span class="v" x-text="r[1]"></span></div>
            </template>
          </div>
        </article>

        <article class="glass card px-4 py-3">
          <h2 class="h2 flex items-center gap-2 pt-1 pb-1"><span class="tile g-sky" x-html="ic.mic"></span>Mic Mini 2</h2>
          <div class="hair">
            <template x-for="r in micButtons" :key="r[0]">
              <div class="row"><span class="k" x-html="r[0]"></span><span class="v" x-text="r[1]"></span></div>
            </template>
          </div>
        </article>

        <article class="glass card px-4 py-3">
          <h2 class="h2 flex items-center gap-2 pt-1 pb-1"><span class="tile g-sage" x-html="ic.led"></span>Đèn mic</h2>
          <div class="hair">
            <template x-for="l in leds" :key="l[1]">
              <div class="row"><span class="flex items-center gap-2.5"><span class="dot" :style="l[0]"></span><span x-text="l[1]"></span></span><span class="v text-soft" x-text="l[2]"></span></div>
            </template>
          </div>
        </article>

        <article class="glass card px-4 py-3">
          <h2 class="h2 flex items-center gap-2 pt-1 pb-2"><span class="tile g-peach" x-html="ic.star"></span>Lần đầu dùng</h2>
          <ol class="space-y-1.5 text-[15px] pb-1">
            <template x-for="(t, i) in firstUse" :key="i">
              <li class="flex gap-2.5"><span class="text-rose font-bold w-4 shrink-0" x-text="i + 1"></span><span x-html="t"></span></li>
            </template>
          </ol>
        </article>

        <article class="glass card px-4 py-3">
          <h2 class="h2 flex items-center gap-2 pt-1 pb-2"><span class="tile g-rose" x-html="ic.battery"></span>Thông số</h2>
          <div class="grid grid-cols-2 gap-2 pb-1">
            <template x-for="s in specs" :key="s[1]">
              <div class="rounded-2xl bg-white/70 border border-white px-3 py-2">
                <p class="font-round text-[18px] font-extrabold leading-tight" x-text="s[0]"></p>
                <p class="text-[12.5px] text-soft leading-snug" x-text="s[1]"></p>
              </div>
            </template>
          </div>
        </article>
      </section>

      <!-- ================= TAB 2: CÔNG THỨC ================= -->
      <section x-show="tab === 1" x-cloak class="fade-in space-y-3">

        <article class="glass card px-4 py-3">
          <div class="flex flex-wrap gap-x-5 gap-y-2 text-[14px]">
            <template x-for="q in presets" :key="q[0]">
              <span><b x-text="q[0]"></b> <span class="text-soft" x-text="q[1]"></span></span>
            </template>
          </div>
          <div class="border-t mt-3 pt-3 flex flex-wrap gap-x-5 gap-y-2 text-[14px]" style="border-color: var(--hairline)">
            <template x-for="g in gimbal" :key="g[0]">
              <span><b x-text="g[0]"></b> <span class="text-soft" x-text="g[1]"></span></span>
            </template>
          </div>
        </article>

        <article class="glass card p-4 space-y-3">
          <template x-for="g in groups" :key="g.id">
            <div>
              <p class="text-[12px] font-bold uppercase tracking-wider text-soft" x-text="g.label"></p>
              <div class="mt-1.5 flex flex-wrap gap-1.5">
                <template x-for="(r, i) in recipes" :key="g.id + i">
                  <button x-show="r.group === g.id" class="press rounded-full px-3 py-1.5 text-[13.5px] font-semibold border transition"
                          :class="recipe === i ? 'bg-rose text-white border-rose' : 'bg-white/75 border-white text-ink'"
                          @click="pick(i)" x-text="r.emoji + ' ' + r.name"></button>
                </template>
              </div>
            </div>
          </template>
        </article>

        <article class="glass card p-4">
          <h2 class="font-round text-[20px] font-extrabold" x-text="cur.emoji + ' ' + cur.name"></h2>
          <div class="mt-2.5 flex flex-wrap gap-1.5">
            <template x-for="t in cur.tags" :key="t"><span class="tag" x-text="t"></span></template>
          </div>
          <ul class="mt-3 space-y-1.5 text-[15px]">
            <template x-for="t in cur.tips" :key="t">
              <li class="flex gap-2"><span class="mt-[9px] h-1.5 w-1.5 rounded-full bg-rose/60 shrink-0"></span><span x-html="t"></span></li>
            </template>
          </ul>
          <div x-show="curGroup.tips" class="mt-4 rounded-2xl bg-white/60 border border-white px-3.5 py-3">
            <p class="text-[12px] font-bold uppercase tracking-wider text-soft">Mẹo chung</p>
            <ul class="mt-1.5 space-y-1 text-[14px] text-ink/85">
              <template x-for="t in (curGroup.tips || [])" :key="t">
                <li class="flex gap-2"><span class="text-rose">·</span><span x-html="t"></span></li>
              </template>
            </ul>
          </div>
        </article>
      </section>

      <!-- ================= TAB 3: SỬA LỖI ================= -->
      <section x-show="tab === 2" x-cloak class="fade-in grid gap-3 md:grid-cols-2 md:items-start">
        <template x-for="grp in fixes" :key="grp.name">
          <article class="glass card px-4 py-3">
            <h2 class="h2 flex items-center gap-2 pt-1 pb-1"><span class="tile" :class="grp.grad" x-html="ic[grp.icon]"></span><span x-text="grp.name"></span></h2>
            <div class="hair">
              <template x-for="f in grp.items" :key="f[0]">
                <div class="py-2.5">
                  <p class="text-[15px] font-semibold" x-text="f[0]"></p>
                  <p class="text-[14px] text-soft leading-snug mt-0.5" x-html="f[1]"></p>
                </div>
              </template>
            </div>
          </article>
        </template>
        <p class="md:col-span-2 text-[12px] text-soft text-center px-6">Theo hướng dẫn của DJI. Tên menu có thể khác đôi chút tùy phiên bản phần mềm.</p>
      </section>
    </main>
  </div>

  <!-- ===== Thanh tab nổi ===== -->
  <nav class="dock glass" aria-label="Điều hướng">
    <div class="relative grid grid-cols-3">
      <div class="indicator" :style="`transform: translateX(${tab * 100}%)`"></div>
      <template x-for="(t, i) in tabs" :key="i">
        <button @click="go(i)" class="relative z-10 flex flex-col items-center gap-0.5 py-2 rounded-full transition-colors"
                :class="tab === i ? 'text-rose' : 'text-soft'" :aria-current="tab === i ? 'page' : null">
          <span x-html="t.glyph"></span>
          <span class="text-[11px] font-semibold" x-text="t.label"></span>
        </button>
      </template>
    </div>
  </nav>

  <script>
    const svg = (d, s = 15, w = 2.2) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
    const P = {
      cam:     '<rect x="3" y="7" width="18" height="13" rx="3"/><circle cx="12" cy="13.5" r="3.5"/><path d="M9 7l1.5-3h3L15 7"/>',
      hand:    '<path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V11M12 10.5V9a1.5 1.5 0 0 1 3 0v2M15 10.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-.5a6 6 0 0 1-4.8-2.4L4.5 15.5a1.5 1.5 0 0 1 2.3-1.9L9 15.5"/>',
      mic:     '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/>',
      led:     '<circle cx="12" cy="12" r="4" fill="currentColor"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
      star:    '<path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/>',
      battery: '<rect x="2.5" y="7" width="17" height="10" rx="2.5"/><path d="M22 10.5v3M6 10v4"/>',
      image:   '<rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 9"/>',
      phone:   '<rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M12 8v6M9.5 11.5L12 14l2.5-2.5"/>',
      bolt:    '<path d="M13 2.5L4.5 13.5H12l-1 8 8.5-11H12z"/>',
      film:    '<rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/>',
      help:    '<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5v.3"/><path d="M12 17h.01"/>',
    };

    function app() {
      return {
        tab: 0,
        recipe: 0,
        ic: Object.fromEntries(Object.entries(P).map(([k, d]) => [k, svg(d)])),

        tabs: [
          { label: 'Điều khiển', title: 'Điều khiển', glyph: svg(P.bolt, 22, 1.8) },
          { label: 'Công thức',  title: 'Công thức quay', glyph: svg(P.film, 22, 1.8) },
          { label: 'Sửa lỗi',    title: 'Sửa lỗi nhanh', glyph: svg(P.help, 22, 1.8) },
        ],

        /* ---------- Điều khiển ---------- */
        camButtons: [
          ['Xoay màn hình', 'Bật / tắt máy'],
          ['<span class="dot" style="background:#E5484D"></span>Nút đỏ', 'Quay / dừng'],
          ['Joystick <span class="text-rose">×2</span>', 'Căn giữa cam'],
          ['Joystick <span class="text-rose">×3</span>', 'Lật cam (selfie)'],
          ['Giữ Joystick', 'Khóa hướng cam'],
          ['Zoom <span class="text-rose">×1</span> / <span class="text-rose">×2</span>', '2x / 4x'],
          ['Nút tùy chỉnh', 'Tự gán chức năng'],
        ],
        gestures: [
          ['↓ Vuốt từ trên', 'Gimbal, Wi-Fi, cài đặt'],
          ['↑ Vuốt từ dưới', 'Độ phân giải, fps, tỉ lệ'],
          ['→ Vuốt từ trái', 'Xem lại'],
          ['← Vuốt từ phải', 'Làm đẹp, màu, mic'],
          ['Chạm đúp', 'ActiveTrack (× để tắt)'],
          ['✋ Lòng bàn tay', 'Bật / tắt bám theo'],
          ['✌️ Chữ V', 'Quay / dừng (0,5–5 m)'],
        ],
        micButtons: [
          ['Lấy khỏi hộp', 'Tự bật, tự kết nối'],
          ['Đúp nút nguồn', 'Bật / tắt khử ồn'],
          ['Giữ nguồn 2s', 'Bật / tắt'],
          ['Giữ Linking 2s', 'Ghép máy mới'],
          ['Với điện thoại', 'Cắm bộ thu'],
        ],
        leds: [
          ['background:#3B82F6', 'Xanh dương', 'Nối thẳng Pocket / điện thoại'],
          ['background:#22C55E', 'Xanh lá', 'Nối bộ thu'],
          ['background:#22C55E;opacity:.4', 'Nhấp nháy', 'Chưa kết nối'],
          ['background:linear-gradient(90deg,#3B82F6 50%,#22C55E 50%)', 'Luân phiên', 'Đang ghép'],
          ['background:#EF4444', 'Đỏ', 'Pin ≤ 10%'],
          ['background:#F5B700', 'Vàng', 'Đang khử ồn'],
        ],
        firstUse: [
          'Kích hoạt bằng app <b>DJI Mimo</b> (bắt buộc)',
          'Cập nhật firmware máy và mic qua Mimo',
          'Bật tùy chọn <b>khử ồn bằng nút</b> cho mic trong Mimo',
          'Ghép mic: giữ <b>Linking 2s</b> → Pocket vuốt xuống › <b>Micro không dây</b>',
          'Thẻ microSD <b>U3 / V30</b>',
        ],
        specs: [
          ['~4 giờ', 'pin, quay 1080p'],
          ['~2 giờ', 'pin, quay 4K60'],
          ['~30 phút', 'sạc đầy (sạc PD)'],
          ['~11 / 48 giờ', 'pin mic / kèm hộp sạc'],
          ['400 m', 'tầm xa mic tối đa'],
          ['Không', 'chống nước'],
        ],

        /* ---------- Công thức ---------- */
        presets: [
          ['4K30', 'hằng ngày'], ['4K60', 'chuyển động'], ['4K24', 'chất phim'], ['Slow Motion', 'quay chậm'], ['Low-Light', 'trời tối'],
        ],
        gimbal: [
          ['Follow', 'mặc định'], ['Tilt Locked', 'đi bộ'], ['FPV', 'nghiêng theo tay'],
        ],
        groups: [
          { id: 'beauty', label: '💄 Beauty TikTok', tips: [
            'Video 15–45 giây, hook trong 3 giây đầu',
            'Chừa trống phía dưới và bên phải cho chữ, nút của TikTok',
            'Ghi rõ sản phẩm được tặng hay tự mua',
          ]},
          { id: 'cinema', label: '🎞️ Phong cảnh điện ảnh', tips: [
            '4K24, mỗi cảnh giữ 5–8 giây, máy đứng yên hoặc lia thật chậm',
            'Giờ vàng, giờ xanh. Có tiền cảnh để tạo chiều sâu',
            'Đủ 3 cỡ cảnh: toàn, trung, cận chi tiết',
            'Khi dựng: viền đen 2.35:1, chỉnh màu theo gợi ý 🎨',
          ]},
          { id: 'other', label: 'Khác' },
        ],
        recipes: [
          /* Beauty */
